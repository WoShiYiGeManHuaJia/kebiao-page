name: probe_life
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run life probe
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
          CM_PAT: ${{ secrets.CM_PAT }}
        run: python probe_life.py
