name: update-kebiao
# ⚠ 学校接口 222.243.161.213:81 是内网/教育网地址，
#   GitHub Actions（境外机房）连不上，实测 login 阶段即超时。
#   因此关闭 schedule，改由路由器（国内网络）负责定时拉取与推送。
#   保留 workflow_dispatch，需要时可在网页手动点一次（仅用于重跑样式渲染）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pull and render latest
        env:
          KB_USER_NO: ${{ secrets.KB_USER }}
          KB_PWD_ENC: ${{ secrets.KB_PWD }}
          KB_SCHOOL_CODE: ${{ secrets.KB_SCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_kebiao_gh.py
