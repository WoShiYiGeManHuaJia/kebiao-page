name: update-kebiao
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pull and render latest
        env:
          KB_USER_NO: ${{ secrets.KB_USER }}
          KB_PWD_ENC: ${{ secrets.KB_PWD }}
          KB_SCHOOL_CODE: ${{ secrets.KB_SCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_kebiao_gh.py
      - name: commit if local file changed
        run: |
          git config user.name "marvis-bot"
          git config user.email "marvis-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
          else
            git commit -m "auto-update $(date -u +%F_%H%M)"
            git push origin main
          fi
