name: update-kebiao
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 用新版脚本（含玻璃质感 + 放假调休规则），脚本自行通过 API 推送 index.html。
      # 这里不再做 git add/commit，避免用 checkout 的旧文件回写覆盖最新页面。
      - name: pull and render latest
        env:
          KB_USER_NO: ${{ secrets.KB_USER }}
          KB_PWD_ENC: ${{ secrets.KB_PWD }}
          KB_SCHOOL_CODE: ${{ secrets.KB_SCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_kebiao_gh.py
