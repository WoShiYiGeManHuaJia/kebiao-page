name: update-kebiao
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pull and render latest
        env:
          KB_USER: ${{ secrets.KB_USER }}
          KB_PWD: ${{ secrets.KB_PWD }}
          KB_SCH: ${{ secrets.KB_SCH }}
        run: python render.py
      - name: commit and push if changed
        run: |
          git config user.name "marvis-bot"
          git config user.email "marvis-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
          else
            git commit -m "auto-update $(date -u +%F_%H%M)"
            git push origin main
          fi
