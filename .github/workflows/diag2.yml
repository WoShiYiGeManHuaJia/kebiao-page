name: diag2-port-and-worker
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: run
        env:
          U: ${{ secrets.KB_USER }}
          P: ${{ secrets.KB_PWD }}
          S: ${{ secrets.KB_SCH }}
        run: |
          OUT="${RUNNER_TEMP}/d2.txt"; : > "$OUT"
          exec > >(tee -a "$OUT") 2>&1
          echo "=== A. 端口扫描 222.243.161.213 ==="
          for p in 80 81 443 8000 8080 8888 8081 82; do
            code=$(curl -sS -o /dev/null --max-time 12 -w "%{http_code}|c=%{time_connect}s" "http://222.243.161.213:$p/" 2>/dev/null)
            echo "port=$p -> $code"
          done
          echo ""
          echo "=== B. 80 端口上是否有 /hnrjzyxyhd 接口 ==="
          curl -sS -i --max-time 20 "http://222.243.161.213/hnrjzyxyhd/" 2>&1 | head -15
          echo ""
          echo "--- 80 端口登录尝试 ---"
          curl -sS --max-time 25 -o /tmp/l80.json -w "[http=%{http_code} total=%{time_total}s]\n" \
            -G "http://222.243.161.213/hnrjzyxyhd/login" \
            --data-urlencode "userNo=${U}" --data-urlencode "pwd=${P}" \
            --data-urlencode "encode=1" --data-urlencode "captchaData=" --data-urlencode "codeVal=" 2>&1 | head -5
          echo "resp:"; head -c 300 /tmp/l80.json 2>/dev/null; echo ""
          echo ""
          echo "=== C. 81 端口根目录 (25s) ==="
          curl -sS -i --max-time 25 "http://222.243.161.213:81/" 2>&1 | head -12
          echo ""
          echo "=== D. 从 Actions 访问 Cloudflare Worker ==="
          curl -sS --max-time 25 -w "\n[http=%{http_code} total=%{time_total}s]\n" "https://kebiao.wispy-hill-817a.workers.dev/" 2>&1 | head -20
          echo ""
          echo "=== E. traceroute 到 81 (ICMP/TCP) ==="
          (which traceroute && timeout 40 traceroute -T -p 81 -m 12 -w 3 222.243.161.213 2>&1 | head -15) || echo "no traceroute"
          echo "=== END ==="

      - name: save
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json,base64,urllib.request,os
          TOK=os.environ["T"]; REPO="WoShiYiGeManHuaJia/kebiao-page"
          SRC=os.path.join(os.environ["RUNNER_TEMP"],"d2.txt")
          content=base64.b64encode(open(SRC,'rb').read()).decode()
          H={"Authorization":"token "+TOK,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"d"}
          path="/repos/%s/contents/diag/result2.txt"%REPO
          sha=None
          try:
              sha=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com"+path+"?ref=main",headers=H),timeout=60).read())["sha"]
          except Exception as e: print("no existing:",e)
          body={"message":"diag2","content":content,"branch":"main"}
          if sha: body["sha"]=sha
          try:
              d=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com"+path,data=json.dumps(body).encode(),method="PUT",headers=H),timeout=90).read())
              print("SAVED:",d["content"]["path"])
          except Exception as e:
              print("FAIL:",e)
          PYEOF
