name: diag-school-api
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 1. runner 出口 IP 与地理位置
        run: |
          echo "--- outbound ip ---"
          curl -sS --max-time 15 https://api.ipify.org?format=json || echo "ipify fail"
          echo ""
          curl -sS --max-time 15 http://ip-api.com/json/ || echo "ip-api fail"
          echo ""

      - name: 2. TCP 连通性（81 端口，逐级超时）
        run: |
          for t in 5 15 45; do
            echo "--- timeout=${t}s ---"
            start=$(date +%s.%N)
            timeout $t bash -c 'cat < /dev/null > /dev/tcp/222.243.161.213/81' 2>&1 && echo "TCP OK" || echo "TCP FAIL(rc=$?)"
            end=$(date +%s.%N)
            echo "elapsed: $(echo "$end - $start" | bc)"
          done

      - name: 3. HTTP 请求（curl 详细计时，60s 超时）
        run: |
          echo "--- GET /hnrjzyxyhd/ ---"
          curl -sS -i --max-time 60 -w "\n[http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s starttransfer=%{time_starttransfer}s total=%{time_total}s size=%{size_download}]\n" \
            "http://222.243.161.213:81/hnrjzyxyhd/" 2>&1 | head -40

      - name: 4. 登录接口（真实账号，60s 超时）
        env:
          U: ${{ secrets.KB_USER }}
          P: ${{ secrets.KB_PWD }}
          S: ${{ secrets.KB_SCH }}
        run: |
          echo "--- login ---"
          curl -sS --max-time 60 -w "\n[http=%{http_code} connect=%{time_connect}s total=%{time_total}s]\n" \
            -X POST \
            "http://222.243.161.213:81/hnrjzyxyhd/login?userNo=${U}&pwd=${P}&encode=1&captchaData=&codeVal=" \
            2>&1 | head -c 600
          echo ""

      - name: "5. 备用 - 换 HTTPS/80 端口探测"
        run: |
          for u in "http://222.243.161.213/" "https://222.243.161.213/" "http://222.243.161.213:81/"; do
            echo "--- $u ---"
            curl -sS -o /dev/null --max-time 25 -w "http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" "$u" 2>&1 | head -3
          done
