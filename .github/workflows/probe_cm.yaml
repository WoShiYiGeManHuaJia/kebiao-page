name: probe_cm
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install playwright
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Run probe
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
          CM_PAT: ${{ secrets.CM_PAT }}
        run: python probe_cm.py 2>&1 | tee probe_log.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -f probe_log.txt probe_out.json 2>/dev/null || true
          git commit -m "probe result $(date -u +%s)" || echo "nothing to commit"
          git push || echo "push failed"
