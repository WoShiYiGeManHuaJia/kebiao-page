name: probe_cm
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install playwright
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Run probe
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
        run: python probe_cm.py 2>&1 | tee probe_log.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-probe
          path: |
            probe_log.txt
            probe_out.json
